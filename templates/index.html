<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmShield AI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🌱 FarmShield AI</h1>
        <p>Climate Risk & Farmer Resilience Assistant</p>
    </header>

    <section class="dashboard">
        <h2>Crop Climate Risk Analyzer</h2>
        <p>Enter your crop and weather conditions.</p>

        <form id="riskForm">
            <label>Select Crop</label>
            <select id="crop" required>
                <option value="">Choose your crop</option>
                <option>Rice</option>
                <option>Tomato</option>
                <option>Wheat</option>
                <option>Maize</option>
                <option>Cotton</option>
                <option>Sugarcane</option>
            </select>

            <label>Temperature (°C)</label>
            <input type="number" id="temperature" placeholder="Example: 35" required>

            <label>Rainfall (mm)</label>
            <input type="number" id="rainfall" placeholder="Example: 100" required>

            <button type="submit">🔍 Analyze Climate Risk</button>
        </form>

        <div id="result"></div>
    </section>

    <footer>
        <p>FarmShield AI 🌍 | Protecting crops through smarter decisions</p>
        <small>Prototype estimates only — not a live weather forecast.</small>
    </footer>
</div>

<script src="/static/script.js"></script>
</body>
</html>
